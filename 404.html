<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina non trovata | Villa del Conte</title>
    <meta name="description" content="La pagina cercata non esiste. Torna alla home di Villa del Conte, case vacanze a Santa Domenica di Ricadi.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="/images/ui/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Lato:ital,wght@0,400;0,700&family=Poppins:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde: #1d3b2a;
            --oro: #c8a24a;
            --crema: #fdfbf7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 40px 16px;
            background: var(--crema);
            color: var(--verde);
            font-family: 'Lato', sans-serif;
            text-align: center;
        }

        img { width: 110px; margin-bottom: 24px; }

        .code {
            font-family: 'Poppins', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--oro);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2em, 6vw, 3.4em);
            font-weight: 700;
            margin: 4px 0 12px 0;
        }

        p {
            max-width: 46ch;
            margin: 0 0 32px 0;
            font-size: 1.1em;
            line-height: 1.7;
            color: #555;
        }

        .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }

        a.btn {
            display: inline-block;
            padding: 14px 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95em;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a.primary { background: var(--verde); color: #fff; }
        a.secondary { background: transparent; color: var(--verde); border: 1px solid rgba(29, 59, 42, 0.35); }

        a.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12); }

        a.btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            a.btn { transition: none; }
            a.btn:hover { transform: none; }
        }
    </style>
</head>

<body>
    <img src="/images/ui/logo.svg" alt="Logo Villa del Conte">
    <p class="code">Errore 404</p>
    <h1>Questa pagina non esiste</h1>
    <p>Forse il link è vecchio o contiene un errore di battitura. Le nostre strutture, invece, sono al loro posto sulla
        Costa degli Dei.</p>
    <div class="actions">
        <a class="btn primary" href="/">Torna alla home</a>
        <a class="btn secondary" href="/#blog">Leggi il Notebook</a>
    </div>
</body>

</html>
